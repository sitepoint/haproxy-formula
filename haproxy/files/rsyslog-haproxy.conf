{%- set log_file_path = salt['pillar.get']('haproxy:log_file_path') %}
{%- set chrooted = salt['pillar.get']('haproxy:global:chroot:enable', False) %}
{%- set chroot_path = salt['pillar.get'](
      'haproxy:global:chroot:path', '/var/lib/haproxy'
    )
-%}
# HAProxy logging configuration for rsyslog.
#
# **** DO NOT EDIT THIS FILE ****
#
# This file is managed by Salt, replacing the copy shipped in the
# haproxy package. Any changes will be overwritten.
{%- if chrooted %}
#
# HAProxy chroots to {{ chroot_path }} and so cannot reach /dev/log.
# It is given a dedicated socket inside the chroot, bound to its own
# ruleset, so that only genuine HAProxy syslog output is written to the
# log file. The ruleset has to be declared before the input that
# references it.
ruleset(name="haproxy") {
    action(type="omfile"
        file="{{ log_file_path }}"
        fileOwner="root"
        fileGroup="adm"
        fileCreateMode="0640"
    )
    stop
}

input(type="imuxsock"
    Socket="{{ chroot_path }}/dev/log"
    ruleset="haproxy"
)

# Anything still tagged "haproxy" at this point reached rsyslog because
# journald forwarded the process's stderr, duplicating what the socket
# above already delivered. Those messages remain available through
# "journalctl -u haproxy"; discard them here so that they neither
# duplicate the log file nor fall through to the general system log.
if $programname startswith "haproxy" then {
    stop
}
{%- else %}
#
# HAProxy is not chrooted, so it logs to the system /dev/log and its
# messages can only be told apart by program name. Note that on systemd
# hosts this also matches the copy journald forwards from HAProxy's
# stderr, so state changes may appear twice. Enable chroot to separate
# the two.
if $programname startswith "haproxy" then {
    action(type="omfile"
        file="{{ log_file_path }}"
        fileOwner="root"
        fileGroup="adm"
        fileCreateMode="0640"
    )
    stop
}
{%- endif %}
